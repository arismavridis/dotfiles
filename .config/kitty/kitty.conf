shell fish
shell_integration enabled

allow_remote_control yes
listen_on unix:/tmp/kitty

enable_audio_bell no

text_composition_strategy legacy

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

cursor_shape_unfocused hollow
cursor_blink_interval 0 linear ease-out

scrollback_lines 3000

# Window
remember_window_size  yes
hide_window_decorations yes
window_padding_width  2
tab_bar_margin_height 2.0 0.0

startup_session none

background_opacity 1.0

active_border_color none
inactive_border_color #000000

tab_bar_style separator
tab_separator ""
tab_bar_background none
tab_title_template " {index}:{title} "
active_tab_title_template "[{index}:{title}]"
active_tab_font_style   normal

map kitty_mod+y set_window_title " "

map kitty_mod+enter new_window_with_cwd
map kitty_mod+t new_tab_with_cwd
map kitty_mod+n new_os_window_with_cwd

map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9

enabled_layouts fat, tall
window_border_width 0

# https://sw.kovidgoyal.net/kitty/conf/#select-and-act-on-visible-text
action_alias myhints kitten hints --alphabet qfjdkslaureitywovmcxzpq1234567890
map kitty_mod+p>shift+f myhints --type path
map kitty_mod+p>f myhints --type path --program -
map kitty_mod+p>l myhints --type line --program -
map kitty_mod+p>w myhints --type word --program -
map kitty_mod+p>h myhints --type hash --program -
map kitty_mod+p>y myhints --type hyperlink
map kitty_mod+p>n myhints --type --type=linenum --linenum-action=tab nvim +{line} {path}
map kitty_mod+p>shift+n myhints --type --type=linenum --linenum-action=os_window nvim +{line} {path}

scrollback_pager env KITTYSCROLL=1 nvim +'call nvim_open_term(0, {})' +'set readonly nolist' +'$' -
map kitty_mod+space show_scrollback
